<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Реестр ОП — рабочие материалы отдела продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fd;
    --card: #ffffff;
    --ink: #1a1c22;
    --ink-muted: #5c6070;
    --ink-faint: #9a9border;
    --accent: #1230d1;
    --accent-dark: #0b1e8f;
    --accent-soft: #e8ebfc;
    --warn: #9c3b2e;
    --warn-soft: #f5e3df;
    --line: #dfe2ee;
    --number: #5568c9;
    --header-bg: #dfe6f8;
    --page-grad: radial-gradient(ellipse 1100px 750px at 22% 0%, #ffffff 0%, #eef2fd 45%, #dbe3f6 100%);
    --input-bg: #ffffff;
    --shadow: rgba(32,36,31,0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c17; --card: #24251f; --ink: #e9e6da; --ink-muted: #a8a493; --ink-faint: #6f6c60;
      --accent: #74ab8f; --accent-dark: #4c8069; --accent-soft: #223228; --warn: #d1786a; --warn-soft: #3a2521;
      --line: #3a3a30; --number: #6b8f7d; --header-bg: #212019; --input-bg: #24251f;
      --shadow: rgba(0,0,0,0.35);
      --page-grad: radial-gradient(ellipse 1100px 750px at 22% 0%, #202119 0%, #1b1c17 55%, #16170f 100%);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c17; --card: #24251f; --ink: #e9e6da; --ink-muted: #a8a493; --ink-faint: #6f6c60;
    --accent: #74ab8f; --accent-dark: #4c8069; --accent-soft: #223228; --warn: #d1786a; --warn-soft: #3a2521;
    --line: #3a3a30; --number: #6b8f7d; --header-bg: #212019; --input-bg: #24251f;
    --shadow: rgba(0,0,0,0.35);
    --page-grad: radial-gradient(ellipse 1100px 750px at 22% 0%, #202119 0%, #1b1c17 55%, #16170f 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page-grad); color: var(--ink); min-height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }

  /* category accent colors */
  .cat-0 { --catcolor: #2f6fb0; --catcolor-soft: #e2ecf7; } /* Материалы для клиентов — синий */
  .cat-1 { --catcolor: #2f7d5c; --catcolor-soft: #e2f1ea; } /* Регламенты и процессы — зелёный */
  .cat-2 { --catcolor: #0e7c86; --catcolor-soft: #dff1f2; } /* Продукт и клиенты — бирюза */
  .cat-3 { --catcolor: #a83e5c; --catcolor-soft: #f7e3ea; } /* Скрипты и возражения — вишнёвый */
  .cat-4 { --catcolor: #c2477e; --catcolor-soft: #f9e6ef; } /* Материалы для клиентов — розовый */
  .cat-5 { --catcolor: #7b4fa0; --catcolor-soft: #efe6f7; } /* Обучение и мероприятия — фиолетовый */
  .cat-6 { --catcolor: #46618a; --catcolor-soft: #e6ecf5; } /* Нормативная база — стальной синий */
  .cat-7 { --catcolor: #34556b; --catcolor-soft: #e3eaef; } /* Инструменты — сланцевый */

  header.masthead {
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    padding: 18px 28px calc(14px);
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  .masthead-row {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: center; gap: 18px;
  }
  .stamp {
    width: 50px; height: 50px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; font-weight: 800;
  }
  .stamp img { width: 100%; height: 100%; object-fit: contain; }
  .masthead-title { flex: 1; min-width: 0; }
  .masthead-title h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800; font-size: 22px; margin: 0;
    letter-spacing: -0.01em;
  }
  .masthead-title p { margin: 2px 0 0; color: var(--ink-muted); font-size: 12.5px; }
  .search-field {
    flex: 0 1 300px;
    border-bottom: 1.5px solid var(--ink-faint);
    padding: 4px 2px;
  }
  .search-field input {
    width: 100%; border: none; background: transparent; outline: none;
    color: var(--ink); font-family: inherit; font-size: 13.5px;
  }
  .search-field input::placeholder { color: var(--ink-faint); }
  .theme-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 13px; flex-shrink: 0;
  }

  .layout { max-width: 1120px; margin: 0 auto; display: block; }

  .tabbar-wrap {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 9;
  }
  .tabbar {
    max-width: 1120px; margin: 0 auto;
    display: flex; gap: 8px; overflow-x: auto;
    padding: 14px 28px 12px;
    -ms-overflow-style: none; scrollbar-width: thin;
  }
  .tabbar::-webkit-scrollbar { height: 5px; }
  .tabbar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .tab-btn {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .tab-btn .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--catcolor, var(--ink-faint)); flex-shrink: 0; }
  .tab-btn .n { color: var(--ink-faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .tab-btn.active {
    border-color: var(--catcolor, var(--accent));
    background: var(--catcolor-soft, var(--accent-soft));
    font-weight: 700;
    color: var(--ink);
  }
  .tab-btn:hover:not(.active) { background: var(--header-bg); }

  main { flex: 1; min-width: 0; padding: 26px 28px 70px; max-width: 1120px; margin: 0 auto; }

  .section-block { margin-bottom: 30px; }
  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 10px;
  }
  .section-head .swatch-bar { width: 4px; height: 16px; background: var(--catcolor, var(--accent-dark)); flex-shrink: 0; }
  .section-head h2 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; margin: 0; letter-spacing: -0.005em; }
  .section-head .count { color: var(--ink-faint); font-size: 12px; }

  .reg-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
  }
  .reg-row:hover { background: var(--header-bg); }
  .reg-num { color: var(--number); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .reg-main .reg-title { font-weight: 600; font-size: 14.5px; }
  .reg-main .reg-title .type-chip {
    display: inline-block; font-size: 10.5px; font-weight: 500; color: var(--catcolor, var(--ink-muted));
    border: 1px solid var(--catcolor, var(--line)); border-radius: 3px; padding: 0 5px; margin-right: 7px;
    vertical-align: middle;
  }
  .reg-main .reg-value { color: var(--ink-muted); font-size: 12.5px; margin-top: 3px; }
  .reg-main .reg-secondary { color: var(--ink-faint); font-size: 12px; margin-top: 3px; font-style: italic; }
  .reg-action { text-align: right; white-space: nowrap; padding-top: 2px; }
  .reg-action a.open {
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
  }
  .no-link-tag {
    font-size: 11px; color: var(--ink-faint); border: 1px dashed var(--line); border-radius: 3px; padding: 2px 7px;
  }
  .confid-tag {
    display: inline-block; font-size: 10.5px; color: var(--warn); background: var(--warn-soft);
    border-radius: 3px; padding: 2px 7px; margin-top: 5px;
  }

  .intro-block { max-width: 680px; margin-bottom: 24px; }
  .intro-block p { color: var(--ink-muted); }
  .intro-block .tally { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; margin-top: 6px; }
  .intro-block .tally b { color: var(--accent); }

  footer.regfoot {
    max-width: 1120px; margin: 0 auto; padding: 16px 28px 44px;
    font-size: 11.5px; color: var(--ink-faint); border-top: 1px solid var(--line);
  }

  @media (max-width: 780px) {
    main { padding: 18px 16px 60px; }
    .tabbar { padding: 12px 16px 10px; }
    .masthead-row { flex-wrap: wrap; }
    .search-field { flex-basis: 100%; order: 3; }
    .reg-row { grid-template-columns: 28px 1fr; }
    .reg-action { grid-column: 2; text-align: left; margin-top: 4px; }
    .reg-num { font-size: 11px; }
  }
</style>
</head>

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const root = document.documentElement;
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = root.getAttribute('data-theme');
  if (cur === 'dark') root.setAttribute('data-theme','light');
  else if (cur === 'light') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme','dark');
});

const categories = [...new Set(ITEMS.map(i => i.category))];
const catIndex = {}; categories.forEach((c,i) => catIndex[c] = i % 8);

const withLink = ITEMS.filter(i => i.url).length;
document.getElementById('statsLine').textContent = `${ITEMS.length} записей · ${withLink} со ссылкой`;

document.getElementById('catList').innerHTML =
  `<button class="tab-btn active" data-cat="">Все разделы<span class="n">${ITEMS.length}</span></button>` +
  categories.map((c,i) =>
    `<button class="tab-btn cat-${catIndex[c]}" data-cat="${esc(c)}"><span class="swatch"></span>${esc(c)}<span class="n">${ITEMS.filter(x=>x.category===c).length}</span></button>`
  ).join('');

function rowHtml(it, num){
  const catIdx = catIndex[it.category] ?? 0;
  const action = it.url
    ? `<a class="open" href="${it.url}" target="_blank" rel="noopener">Открыть</a>`
    : `<span class="no-link-tag">нет ссылки</span>`;
  return `<div class="reg-row cat-${catIdx}">
    <div class="reg-num">${String(num).padStart(3,'0')}</div>
    <div class="reg-main">
      <div class="reg-title"><span class="type-chip">${esc(it.type)}</span>${esc(it.label)}</div>
      ${it.raw_value ? `<div class="reg-value">${esc(it.raw_value)}</div>` : ''}
      ${it.secondary_note ? `<div class="reg-secondary">${esc(it.secondary_note)}</div>` : ''}
      ${it.hidden ? `<div class="confid-tag">🔒 конфиденциально</div>` : ''}
    </div>
    <div class="reg-action">${action}</div>
  </div>`;
}

let globalNum = 0;
function renderAll(filterCat){
  globalNum = 0;
  const cats = filterCat ? [filterCat] : categories;
  document.getElementById('content').innerHTML = cats.map(cat => {
    const items = ITEMS.filter(i => i.category === cat);
    const catIdx = catIndex[cat] ?? 0;
    const rows = items.map(it => { globalNum++; return rowHtml(it, globalNum); }).join('');
    return `<div class="section-block cat-${catIdx}">
      <div class="section-head"><div class="swatch-bar"></div><h2>${esc(cat)}</h2><span class="count">${items.length}</span></div>
      ${rows}
    </div>`;
  }).join('');
}
renderAll(null);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    renderAll(btn.dataset.cat || null);
  });
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderAll(null); return; }
  const matches = ITEMS.filter(i => i.label.toLowerCase().includes(q) || (i.raw_value||'').toLowerCase().includes(q));
  globalNum = 0;
  document.getElementById('content').innerHTML = `<div class="section-block">
    <div class="section-head"><h2>Результаты поиска</h2><span class="count">${matches.length}</span></div>
    ${matches.map(it => { globalNum++; return rowHtml(it, globalNum); }).join('')}
  </div>`;
});
</script>
